<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>بطاقتك التعريفية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{min-height:100vh;min-height:100dvh;background:#f5f8fb;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px 80px;overflow-x:hidden}
.container{width:100%;max-width:480px;text-align:center}
.check{width:68px;height:68px;background:#7aae9a;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px}
h1{font-size:26px;color:#2f425e;font-weight:700;margin-bottom:4px}
.sub{color:#7a8ca0;font-size:14px;margin-bottom:22px}
.card-main{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(47,66,94,0.08)}
.card-top{background:#e6eeec;height:130px;position:relative}
.card-top::before{content:'';position:absolute;bottom:0;left:0;right:0;height:55px;background:#fff;border-radius:80% 80% 0 0}
.avatar-wrap{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:100px;height:100px;background:#fff;border-radius:50%;padding:4px;box-shadow:0 4px 15px rgba(0,0,0,0.07)}
.avatar{width:100%;height:100%;background:#dbe6f0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.avatar svg{width:65px;height:65px;fill:#5a7190}
.name{font-size:22px;font-weight:700;color:#2f425e;margin-top:50px;margin-bottom:2px}
.slogan{font-size:13px;color:#9aaaba;margin-bottom:18px}
.info-box{border:1px solid #f0f3f6;border-radius:14px;margin:0 14px 16px;padding:6px 12px}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid #f1f4f6}
.row:last-child{border:none}
.left{display:flex;align-items:center;gap:8px;color:#2f425e;font-weight:600;font-size:13px}
.icon-sm{width:32px;height:32px;background:#eef3f8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.value{color:#5a7190;font-size:13px;max-width:55%;text-align:left;word-break:break-word}
.btn{width:calc(100% - 28px);height:52px;background:#6a9b8e;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin:0 14px 18px}
@media (max-width:380px){h1{font-size:22px}.name{font-size:19px}.card-top{height:110px}}
</style>
</head>
<body>
<div class="container">
  <div class="check">✓</div>
  <h1>تم حفظ بياناتك بنجاح</h1>
  <p class="sub">هذه هي بطاقتك التعريفية</p>
  <div class="card-main">
    <div class="card-top"><div class="avatar-wrap"><div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5" fill="#5a7190"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6c0 1-1.5 2-8 2s-8-1-8-2z" fill="#5a7190"/></svg></div></div></div>
    <div class="name" id="showName">علي أحمد</div>
    <div class="slogan">مستقبل أفضل يبدأ بمعرفة نفسك</div>
    <div class="info-box">
      <div class="row"><div class="left"><div class="icon-sm">👤</div> الاسم</div><div class="value" id="rName">علي أحمد</div></div>
      <div class="row"><div class="left"><div class="icon-sm">📅</div> العمر</div><div class="value" id="rAge">22 سنة</div></div>
      <div class="row"><div class="left"><div class="icon-sm">🎓</div> التخصص</div><div class="value" id="rMajor">هندسة البرمجيات</div></div>
    <div style="display:flex;gap:10px;margin:0 14px 18px">
  <button class="btn" style="background:#fff;border:1.5px solid #d6dde6;color:#2f425e;flex:1" onclick="location.href='index.html'">🏠 الرئيسية</button>
  <button class="btn" style="flex:1.5" onclick="location.href='examples.html'">دخول منصة الأمثلة 🚀</button>
</div>
</div>
<script>
const params=new URLSearchParams(location.search);
const name=params.get('name')||localStorage.getItem('name')||'علي أحمد';
const age=params.get('age')||localStorage.getItem('age')||'22';
const major=params.get('major')||localStorage.getItem('major')||'هندسة البرمجيات';
document.getElementById('showName').textContent=name;
document.getElementById('rName').textContent=name;
document.getElementById('rAge').textContent=age+' سنة';
document.getElementById('rMajor').textContent=major;
</script>
</body>
</html>
